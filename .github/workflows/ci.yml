name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Gatekeeper
    uses: Florencea/vp-actions/.github/workflows/vp-web-ci.yml@v2
    with:
      enable-platform-compat: true
